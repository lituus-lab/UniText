[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0", "Cython==3.2.8"]
build-backend = "setuptools.build_meta"

[project]
name = "unitext"
version = "0.2.0"
description = "Python binding for structured-document I/O and conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lituus-lab" }]
keywords = ["documents", "markdown", "restructuredtext", "asciidoc", "rtf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.0"]

[tool.setuptools]
packages = ["unitext"]
